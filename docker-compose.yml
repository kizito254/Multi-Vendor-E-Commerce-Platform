version: "3.9"
services:
  mongodb:
    image: mongo:7
    container_name: marketplace-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./server
    container_name: marketplace-api
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/multi_vendor_marketplace
      - JWT_SECRET=change-me-in-production
      - CLIENT_URL=http://localhost:5173
    ports:
      - "5000:5000"

  web:
    build: ./client
    container_name: marketplace-web
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "5173:80"

volumes:
  mongo_data:
