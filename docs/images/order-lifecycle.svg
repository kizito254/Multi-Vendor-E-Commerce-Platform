<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#f8fafc"/>
  <text x="600" y="40" text-anchor="middle" font-family="Arial" font-size="30" fill="#0f172a" font-weight="bold">Order Lifecycle in a Multi-Vendor Marketplace</text>

  <rect x="40" y="120" width="140" height="80" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="167" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">Browse</text>

  <rect x="220" y="120" width="140" height="80" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="167" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">Add to Cart</text>

  <rect x="400" y="120" width="160" height="80" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="167" text-anchor="middle" font-family="Arial" font-size="16" fill="#14532d">Checkout</text>

  <rect x="600" y="120" width="170" height="80" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="167" text-anchor="middle" font-family="Arial" font-size="16" fill="#14532d">Split by Vendor</text>

  <rect x="810" y="120" width="170" height="80" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="895" y="167" text-anchor="middle" font-family="Arial" font-size="16" fill="#7f1d1d">Vendor Fulfillment</text>

  <rect x="1020" y="120" width="140" height="80" rx="10" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1090" y="167" text-anchor="middle" font-family="Arial" font-size="16" fill="#4c1d95">Delivered</text>

  <line x1="180" y1="160" x2="220" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="360" y1="160" x2="400" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="160" x2="600" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="770" y1="160" x2="810" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="980" y1="160" x2="1020" y2="160" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="600" y="280" text-anchor="middle" font-family="Arial" font-size="20" fill="#0f172a" font-weight="bold">Post-Delivery Processes</text>
  <text x="250" y="325" font-family="Arial" font-size="17" fill="#0f172a">• Customer review + rating</text>
  <text x="500" y="325" font-family="Arial" font-size="17" fill="#0f172a">• Refund/dispute handling</text>
  <text x="760" y="325" font-family="Arial" font-size="17" fill="#0f172a">• Vendor settlement payout</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#334155"/>
    </marker>
  </defs>
</svg>
